[workspace]
members = ["lins-core", "lins-server", "lins-render"]
# lins-render is the trial of a Rust-drawn view. It is built for the web by
# scripts/build-render.sh and is left out of an ordinary `cargo build`.
default-members = ["lins-core", "lins-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Fredrik Branstrom"]
description = "A lightweight FalkorDB graph explorer with living docs"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

# What scripts/build-render.sh builds lins-render with: a smaller download for the web, and
# the server's own release build is left as it was.
[profile.web]
inherits = "release"
opt-level = 2
lto = true
codegen-units = 1
strip = "debuginfo"
