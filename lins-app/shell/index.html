<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lins</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* What the window shows when Lins could not start: the reason, and where its settings come from.
     The explorer itself is the page the server carries; this file is only for that one case. */
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b2130;
         color: #d9dce6; font: 15px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 44rem; padding: 2.5rem; }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 1rem; color: #f2f0e8; }
  pre { white-space: pre-wrap; word-break: break-word; background: #141926; border: 1px solid #2c3550;
        border-radius: 8px; padding: 1rem; color: #e7b7a8; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  p { margin: 1rem 0 0; color: #aab3c7; }
  code { font: 13px ui-monospace, Menlo, monospace; color: #d9dce6; }
</style>
</head>
<body>
<main>
  <h1>Lins could not start</h1>
  <pre id="why">No reason was given.</pre>
  <p id="settings"></p>
  <p>Where the database is comes from the settings file, or from the environment:
     <code>LINS_FALKORDB_HOST</code>, <code>LINS_FALKORDB_PORT</code>, <code>LINS_FALKORDB_PASSWORD</code>.
     Quit and open Lins again once it is set.</p>
</main>
<script>
  const failure = window.__LINS_START_FAILURE__;
  if (failure) {
    document.getElementById('why').textContent = failure.why;
    document.getElementById('settings').textContent = failure.settings;
  }
</script>
</body>
</html>
