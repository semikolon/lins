<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The Lins icon: a lens with a small graph seen through it. Drawn by hand as a
       starting point; `cargo tauri icon icons/icon.png` makes the other sizes from it. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3246"/>
      <stop offset="1" stop-color="#171c29"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#3a4560" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1d2434" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#ground)"/>
  <circle cx="512" cy="512" r="286" fill="url(#glass)" stroke="#e9e6dc" stroke-width="30"/>
  <path d="M 318 420 A 214 214 0 0 1 452 306" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round"/>
  <g stroke="#aab3c7" stroke-width="16" stroke-linecap="round">
    <line x1="404" y1="560" x2="536" y2="428"/>
    <line x1="536" y1="428" x2="640" y2="574"/>
    <line x1="404" y1="560" x2="640" y2="574"/>
  </g>
  <circle cx="404" cy="560" r="50" fill="#8b7fd6"/>
  <circle cx="536" cy="428" r="58" fill="#d4a24a"/>
  <circle cx="640" cy="574" r="44" fill="#3aa6a0"/>
</svg>
